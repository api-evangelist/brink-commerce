- event: OrderCreated
  description: Triggered when a new order is created.
- event: ProductAddonCreated
  description: Triggered when a product addon is created.
- event: ProductAddonUpdated
  description: Triggered when a product addon is updated.
- event: ProductVariantCreated
  description: Triggered when a product variant is created.
- event: ProductVariantUpdated
  description: Triggered when a product variant is updated.
- event: ProductParentCreated
  description: A new product parent has been added.
- event: ProductParentUpdated
  description: Any field on a product parent changed.
- event: ProductParentDeleted
  description: A product parent has been removed.
- event: ProductVariantDeleted
  description: A product variant has been removed.
- event: AddonUpdated
  description: Any addon field changed.
- event: AddonDeleted
  description: An addon has been removed.
- event: ProductAddonDeleted
  description: An addon has been detached from a product parent.
- event: DiscountRuleCreated
  description: A new automatic cart rule has been registered.
- event: DiscountRuleUpdated
  description: Any field on a cart rule changed.
- event: DiscountRuleDeleted
  description: A cart rule has been removed.
- event: DiscountCodeRuleUpdated
  description: A code rule's conditions, outcomes, or flags changed.
- event: DiscountCodeRuleDeleted
  description: A code rule has been removed.
- event: DiscountExternalRuleCreated
  description: A new rule triggered by an external reference has been registered.
- event: DiscountExternalRuleUpdated
  description: An external rule's conditions or outcomes changed.
- event: DiscountExternalRuleDeleted
  description: An external rule has been removed.
- event: BundleGroupCreated
  description: A new bundle group (sets of products) has been created.
